# nginx: HTTPS-прокси перед платформой. Сертификат — например, certbot:
#   sudo certbot --nginx -d dragapi.example.com
# Файл — в /etc/nginx/sites-available/dragapi (и ссылка в sites-enabled), затем: sudo nginx -t && sudo systemctl reload nginx
# Платформа при этом: behind_proxy = true, host = "127.0.0.1".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name dragapi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.25+: можно «listen 443 ssl;» + «http2 on;»
    server_name dragapi.example.com;

    ssl_certificate     /etc/letsencrypt/live/dragapi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragapi.example.com/privkey.pem;

    client_max_body_size 25m;          # импорт проектов, картинки, файлы ботов

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # вебсокеты удалённых агентов автоматизации
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # вебхуки сценариев с ?wait=true ждут результата до минуты; агенты держат соединение часами
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
